name: EIE prototype tests

on:
  push:
    branches: [feat/eie-transversal-engine]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: eie-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run Digital South campaign demo
        run: python examples/digital_south_campaign.py
      - name: Run Digital South industrial twin demo
        run: python examples/digital_south_twin_eie.py
