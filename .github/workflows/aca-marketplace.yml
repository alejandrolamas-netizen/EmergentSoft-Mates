name: ACA Marketplace package

on:
  pull_request:
    paths:
      - "products/agentic-compliance-accelerator/aws-marketplace/**"
  push:
    branches:
      - main
      - "feature/agentic-compliance-accelerator-aws-marketplace"
    paths:
      - "products/agentic-compliance-accelerator/aws-marketplace/**"

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/agentic-compliance-accelerator/aws-marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/fulfillment/requirements.txt pytest
      - run: pytest -q
        env:
          PYTHONPATH: .

  cdk-synth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/agentic-compliance-accelerator/aws-marketplace/infra/cdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: npm install -g aws-cdk
      - run: |
          cdk synth \
            -c account="111111111111" \
            -c region="us-east-1" \
            -c marketplaceProductCode="TEST_PRODUCT_CODE" \
            -c certificateArn="arn:aws:acm:us-east-1:111111111111:certificate/00000000-0000-0000-0000-000000000000" \
            -c imageTag="ci"
