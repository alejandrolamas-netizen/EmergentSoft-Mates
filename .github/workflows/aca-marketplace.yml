name: ACA Marketplace package

on:
  pull_request:
    paths:
      - "products/agentic-compliance-accelerator/aws-marketplace/**"
  push:
    branches:
      - main
      - "feature/agentic-compliance-accelerator-aws-marketplace"
    paths:
      - "products/agentic-compliance-accelerator/aws-marketplace/**"

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/agentic-compliance-accelerator/aws-marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/fulfillment/requirements.txt pytest
      - run: pytest -q
        env:
          PYTHONPATH: .
