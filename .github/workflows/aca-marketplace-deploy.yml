name: ACA Marketplace AWS deploy

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: AWS region
        required: true
        default: us-east-1
      marketplace_product_code:
        description: AWS Marketplace product code
        required: true
      deploy:
        description: Deploy CDK after pushing the image
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ inputs.aws_region }}
      AWS_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      MARKETPLACE_PRODUCT_CODE: ${{ inputs.marketplace_product_code }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve AWS account
        id: account
        run: echo "account=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Ensure ECR repository exists
        working-directory: products/agentic-compliance-accelerator/aws-marketplace
        run: |
          aws ecr describe-repositories --repository-names aca-marketplace-fulfillment >/dev/null 2>&1 ||             aws ecr create-repository --repository-name aca-marketplace-fulfillment --image-scanning-configuration scanOnPush

      - name: Build and push fulfillment image
        working-directory: products/agentic-compliance-accelerator/aws-marketplace
        run: |
          REGISTRY="${{ steps.account.outputs.account }}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE="$REGISTRY/aca-marketplace-fulfillment:latest"
          docker build -f services/fulfillment/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Install CDK
        run: |
          python -m pip install --upgrade pip
          pip install -r products/agentic-compliance-accelerator/aws-marketplace/infra/cdk/requirements.txt
          npm install -g aws-cdk

      - name: Deploy CDK
        if: inputs.deploy
        working-directory: products/agentic-compliance-accelerator/aws-marketplace/infra/cdk
        run: |
          cdk deploy             -c account="${{ steps.account.outputs.account }}"             -c region="$AWS_REGION"             -c marketplaceProductCode="$MARKETPLACE_PRODUCT_CODE"             --require-approval never
