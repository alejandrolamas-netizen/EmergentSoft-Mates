services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: aca
      POSTGRES_USER: aca
      POSTGRES_PASSWORD: aca-local-only
    ports:
      - "5432:5432"
    volumes:
      - aca-postgres:/var/lib/postgresql/data

  fulfillment:
    build:
      context: ..
    environment:
      AWS_REGION: us-east-1
      AWS_MARKETPLACE_PRODUCT_CODE: local-test-product
      DATABASE_URL: postgresql+psycopg://aca:aca-local-only@postgres:5432/aca
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  aca-postgres:
